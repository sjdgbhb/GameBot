# =============================================================================
# 多局无尽基础配置文件 — 修改后保存，重新运行 多局无尽.exe 即可生效
# =============================================================================
# 启动时会先弹出配置选择窗口，选中需要执行的任务配置文件
#
# 如需查看或修改完整配置，直接编辑 _internal/config/data/ 下的源文件：
#   war3/jiubing2/tasks/endless/endless.toml         — 多局无尽任务配置（局数、等待时间等）
#   war3/jiubing2/tasks/endless/endless_single.toml  — 无尽刷怪参数（楼层范围、路径点等）
#   war3/jiubing2/heroes/hxd.toml                    — 英雄默认配置（物品栏、圣痕、卡牌、神碎）
# =============================================================================


# ------------------------------ 任务参数 ------------------------------
[tasks.endless.endless]
games = 8            # 游戏总局数
wait_time = 180      # 重置 cd 等待时间（秒）


# ------------------------------ 刷怪楼层 ------------------------------
[tasks.endless.endless_single]
min_level = 15       # 从该层数开始
max_level = 46       # 到该层结束


# ------------------------------ 绑定模式 ------------------------------
# foreground（前台，需切到游戏窗口）/ background（后台，窗口可被遮挡）
# 多开必须 background（变体里可再覆盖）
[war3]
bind_mode = "background"
[kk]
bind_mode = "background"


# ------------------------------ 英雄 ------------------------------
# 存档读取指令（不同英雄存档命令可能不同，默认继承 heroes/hxd.toml 的 -load3）
[hero]
load_save = "-load3"

# 物品栏装备；slot: 0~5 对应物品栏第 1~6 格
# item 填物品名（须与游戏内一致，映射表在 jiubing2.toml 的 items 中）；
# 各格快捷键默认对应 KK 物品栏 1~6
inventory = [
  {slot = 0, item = "血瓶"},
  {slot = 1, item = "水晶"},
  {slot = 2, item = "米奈希尔传送卷轴"},
  {slot = 3, item = "跳刀"},
  {slot = 4, item = "宠物食物"},
  {slot = 5, item = "拾取"},
]


# ------------------------------ 圣痕 ------------------------------
[hero.stigmata]
is_open = true  # 是否使用圣痕
use_index = 1   # 使用第几套圣痕


# ------------------------------ 卡牌 ------------------------------
[hero.card]
is_open = true  # 是否装备卡牌
use_index = [
    [1, 1],
    [1, 2],
    [2, 2],
    [5, 2],
    [5, 5],
    [4, 5],
]  # 示例：[1, 1] 即第1行第1列的卡牌


# ------------------------------ 神碎 ------------------------------
# 注意：[hero.shard] 为整表覆盖，字段必须写全，不能只写部分字段
[hero.shard]
is_open = true       # 是否装备神碎
is_resonance = true  # 是否激活神碎共鸣
is_absorb = false    # 是否吸收覆盖神碎
max_pages = 3        # 神碎最大可用页数
use_index = [
   [1, 2],
   [1, 3],
   [1, 4],
   [3, 1]
]  # 示例：[1, 2] 即第1页第2行
absorb_index = [1, 1]  # 在第几页第几行吸收神碎，会自动覆盖当前位置神碎，务必慎重！！！
