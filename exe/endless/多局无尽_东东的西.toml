# =============================================================================
# 多局无尽变体配置 — 东东的西（多开认领）
# 选择本文件启动时：先加载 多局无尽.toml（基础配置），再用本文件覆盖差异字段
# 复制本文件改名 多局无尽_<玩家名>.toml 即可新增一个玩家配置
# =============================================================================


# ------------------------------ 任务参数 ------------------------------
[tasks.endless.endless]
target_player = "东东的西"   # 多开认领：本账号玩家名（KK 平台显示名），认领失败任务直接停止
games = 8            # 游戏总局数
wait_time = 180      # 重置 cd 等待时间（秒）


# ------------------------------ 刷怪楼层 ------------------------------
[tasks.endless.endless_single]
min_level = 15       # 从该层数开始
max_level = 46       # 到该层结束


# ------------------------------ 绑定模式 ------------------------------
# foreground（前台，需切到游戏窗口）/ background（后台，窗口可被遮挡）
# 多开必须 background
[war3]
bind_mode = "background"
[kk]
bind_mode = "background"


# ------------------------------ 英雄 ------------------------------
# 存档读取指令（根据自己实际情况修改，默认继承 heroes/hxd.toml 的 -load3）
[hero]
load_save = "-load3"

# 物品栏装备；slot: 0~5 对应物品栏第 1~6 格
# item 填物品名（须与游戏内一致，映射表在 jiubing2.toml 的 items 中）；
# 各格快捷键默认对应 KK 物品栏 1~6
inventory = [
  {slot = 0, item = "血瓶"},
  {slot = 1, item = "水晶"},
  {slot = 2, item = "米奈希尔传送卷轴"},
  {slot = 3, item = "跳刀"},
  {slot = 4, item = "宠物食物"},
  {slot = 5, item = "拾取"},
]


# ------------------------------ 圣痕 ------------------------------
[hero.stigmata]
is_open = true  # 是否使用圣痕
use_index = 1   # 使用第几套圣痕


# ------------------------------ 卡牌 ------------------------------
[hero.card]
is_open = true  # 是否装备卡牌
use_index = [
    [1, 1],
    [1, 2],
    [2, 2],
    [5, 2],
    [5, 5],
    [4, 5],
]  # 示例：[1, 1] 即第1行第1列的卡牌


# ------------------------------ 神碎 ------------------------------
# 注意：[hero.shard] 为整表覆盖，字段必须写全，不能只写部分字段
[hero.shard]
is_open = true       # 是否装备神碎
is_resonance = true  # 是否激活神碎共鸣
is_absorb = false    # 是否吸收覆盖神碎（默认关闭，会自动覆盖当前位置神碎，务必慎重！！！）
max_pages = 3        # 神碎最大可用页数
use_index = [
   [1, 2],
   [1, 3],
   [1, 4],
   [3, 1]
]  # 示例：[1, 2] 即第1页第2行
absorb_index = [1, 1]  # 在第几页第几行吸收神碎（is_absorb=true 时生效）
