# =============================================================================
# 钓鱼自动化配置文件
# 修改后保存，重新运行 钓鱼.exe 即可生效
# =============================================================================
# 本文件中的参数会覆盖默认配置。未列出的参数保持默认值。
# 如需查看或修改完整配置，直接编辑 _internal/config/data/ 下的源文件：
#   tasks/others/fishing.toml       — 钓鱼任务详细配置（中钩检测参数等）
#   jiubing2.toml                   — 游戏通用配置
# =============================================================================


# ------------------------------ 窗口尺寸 ------------------------------
# 游戏窗口客户区大小 [宽, 高]
# 所有坐标均以此尺寸标定，必须与游戏实际窗口一致
# KK平台设置：war3（非重置版），窗口模式，窗口大小 1920×1080，分辨率 1920x1080
[war3]
client_size = [1902, 1033]


# ------------------------------ 鱼竿快捷键 ------------------------------
# 鱼竿放在物品栏第几格，对应的数字快捷键
# slot: 0~5 对应物品栏第1~6格
# hotkey: 对应的数字键（"1"~"6"）
[[hero.inventory]]
slot = 3     # 物品栏第4格
id = 7       # 7=鱼竿，请勿修改
hotkey = "4" # 钓鱼快捷键，此处配置的是物品栏第4格快捷键


# ------------------------------ 钓鱼参数 ------------------------------
[tasks.others.fishing]
max_times = 10000           # 抛竿次数（达到后自动停止）
fishing_interval_time = 0.5   # 每次钓鱼间隔时间（秒）
hook_coords = [943, 554]    # 鱼钩抛出位置（屏幕坐标）
clear_nearby_interval = 120 # 定时清理英雄附近地面物品间隔（秒），0=禁用
is_test_check = false       # 测试中钩检测区域（true=先抛一竿测试区域再正式钓鱼，false=直接正式钓鱼）
mode = 0                    # 中钩检测模式：0=找色（红色三角形填充），1=找图


# ------------------------------ 中钩检测参数 ------------------------------
[tasks.others.fishing.check]
# 预判收竿：检测到红色填充后，根据循环周期推算下次出现时刻，提前按键收竿
retract_lead_time = 0.1     # 提前量（秒）。收竿偏晚则调大，收竿过早（红色未出现就收）则调小
hook_sim = 1                # 相似度（找色/找图通用，1=完全匹配，降低会更宽松但可能误触）
status_area_coords = [850, 350, 1200, 450]  # 中钩检测区域 [左,上,右,下]
hook_delta_color = '202020'  # 颜色色差容差（越大越宽松）
# 找色模式（mode=0）参数
hook_color = 'ff0000'       # 中钩三角形填充颜色（红色）
# 找图模式（mode=1）参数
hook_status_image = "hook_status.bmp"       # 中钩检测图片（位于 resources/images/ 目录）
hook_timeout = 15           # 等待中钩超时时间（秒），超时则跳过本次
hook_check_interval = 0.005 # 检测轮询间隔（秒）
