# =============================================================================
# 升级圣痕任务配置文件
# 修改后保存，重新运行 升级圣痕.exe 即可生效
# 本文件中的参数会覆盖默认配置。未列出的参数保持默认值。
# 如需查看或修改完整配置，直接编辑 _internal/config/data/ 下的源文件：
#   tasks/others/upgrade_stigmata.toml      — 升级圣痕任务配置（路线点、圣痕词条等）
#   tasks/atomic/blackstone_gate_harassment.toml — 黑石城城门骚扰原子任务配置
#   scenes/blackstone_city.toml             — 黑石城场景配置
# =============================================================================

# ------------------------------ 窗口尺寸 ------------------------------
[war3]
client_size = [1902, 1033]


# ------------------------------ 升级圣痕任务 ------------------------------
[tasks.others.upgrade_stigmata]
combat_mode = "auto_attack"    # 战斗模式：auto_attack（全程平A）/ cast_skills（自动施法）
loop_interval_time = 1.0       # 两次升级循环之间的间隔（秒）
clear_nearby_probability = 0.30 # 每个路线点清理英雄附近物品的概率（0~1），0 = 禁用
