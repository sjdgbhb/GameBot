name = "jiubing2"
extends = ["war3"]
# =============================================================================
# 游戏机制配置（仅保留升级圣痕任务实际使用的配置段）
# =============================================================================

# ------------------------------ 游戏内指令 ------------------------------
[command]
clear_nearby = "-delh"    # 清理英雄附近地面物品（NearbyCleaner 使用）

# ------------------------------ 圣痕系统 ------------------------------
[stigmata]
load_stigmata = "-shload"   # 读取圣痕指令
switch_hotkey = "F2"        # 打开圣痕界面快捷键
open_coords = [585,769]     # 打开圣痕界面的点击坐标（备用）
coords = [                  # 三套圣痕的开关坐标
    [50, 230],
    [50, 280],
    [50, 330]
]
num_coords = [254,155,740,365]  # 圣痕词条区域坐标（用于显示各词条数值）

# 各词条数值上限
[stigmata.term_limit]
"生命值" = 350
"魔法值" = 350
"暴击伤害" = 50
"物理防御" = 40
"魔法抗性" = 40
"力量" = 40
"自然属性" = 2
"格挡属性" = 5
"穿透属性" = 2
"暴击几率" = 5

# ------------------------------ 原子任务通用配置 ------------------------------
[atomic_task]
accept_text = "已领取"
complete_text = "前往任务发布者处完成任务"
monitor_interval = 0.2          # 持续文字监测线程的 OCR 间隔（秒）

# ------------------------------ 屏幕提示文本 OCR 区域 ------------------------------
[prompt_text]
area_coords = [110, 551, 500, 644]
last_area_coords = [117,588,877,622]

# ------------------------------ 技能面板 ------------------------------
[skill_panel]
first_coords = [1517,842]   # 技能板第一个格子的坐标
gap_x = 106              # 每个格子 X 方向间距
gap_y = 75              # 每个格子 Y 方向间距
rows = 3                # 技能面板行数
cols = 4                # 技能面板列数
learn_skill_grid = [2, 4]  # 打开待学习技能的格子位置（行列索引）
