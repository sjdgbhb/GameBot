# =============================================================================
# 单局无尽变体配置 — 东东的西（多开认领）
# 选择本文件启动时：先加载 单局无尽.toml（基础配置），再用本文件覆盖差异字段
# 复制本文件改名 单局无尽_<玩家名>.toml 即可新增一个玩家配置
# =============================================================================


# ------------------------------ 刷怪参数 ------------------------------
[tasks.endless.endless_single]
target_player = "东东的西"   # 多开认领：本账号玩家名（KK 平台显示名），认领失败任务直接停止
min_level = 15       # 从该层数开始
max_level = 46       # 到该层结束


# ------------------------------ 绑定模式 ------------------------------
# foreground（前台，需切到游戏窗口）/ background（后台，窗口可被遮挡）
# 多开必须 background
[war3]
bind_mode = "background"
