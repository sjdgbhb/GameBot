# =============================================================================
# 单局无尽基础配置文件 — 修改后保存，重新运行 单局无尽.exe 即可生效
# =============================================================================
# 启动时会先弹出配置选择窗口，选中需要执行的任务配置文件
#
# 如需查看或修改完整配置，直接编辑 _internal/config/data/ 下的源文件：
#   war3/jiubing2/tasks/endless/endless_single.toml  — 无尽刷怪参数（楼层范围、路径点等）
#   war3/jiubing2/heroes/hxd.toml                    — 英雄默认配置（物品栏、圣痕、卡牌、神碎）
# =============================================================================


# ------------------------------ 刷怪参数 ------------------------------
[tasks.endless.endless_single]
min_level = 15       # 从该层数开始
max_level = 46       # 到该层结束


# ------------------------------ 绑定模式 ------------------------------
# foreground（前台，需切到游戏窗口）/ background（后台，窗口可被遮挡）
# 多开必须 background（变体里可再覆盖）
[war3]
bind_mode = "background"
