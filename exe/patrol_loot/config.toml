# =============================================================================
# 刷装备自动化配置文件
# 修改后保存，重新运行 刷装备.exe 即可生效
# =============================================================================
# 本文件中的参数会覆盖默认配置。未列出的参数保持默认值。
# 如需查看或修改完整配置，直接编辑 _internal/config/data/ 下的源文件：
#   tasks/others/patrol_loot.toml   — 刷装备任务详细配置（路线点坐标、巡逻参数等）
#   jiubing2.toml                   — 游戏通用配置（宝箱检测、拾取、宠物等）
# =============================================================================


# ------------------------------ 窗口尺寸 ------------------------------
[war3]
client_size = [1902, 1033]


# ------------------------------ 物品栏装备 ------------------------------
# slot: 0~5 对应物品栏第1~6格
# item_id: 物品 id，快捷键从 kk.toml 的 inventory_slots 查找
[hero]
inventory = [
  {slot = 3, item_id = 6},  # 跳刀（unknown_cave 路线需要，strange_land 不需要）
  {slot = 4, item_id = 9},  # 宠物食物（必须装备，否则任务拒绝启动）
  {slot = 5, item_id = 0},  # 拾取（固定第6格，勿修改）
]


# ------------------------------ 刷装备参数 ------------------------------
[tasks.others.patrol_loot]
# 路线方案：strange_land 或 unknown_cave
route_scheme = "strange_land"

# 拾取目标物品及数量，达到指定数量后不再拾取该物品
# count = 0 表示只识别不拾取（用于过滤）
desired_items = [
    { name = "玄武盔", count = 3 },
    { name = "龙王盔", count = 3 },
    { name = "白眼魔盔", count = 3 },
    { name = "抗魔指环", count = 4 },
    { name = "封魔指环", count = 4 },
    { name = "神殿守卫者战靴", count = 1 },
    { name = "神殿监察者皮靴", count = 1 },
]


# ------------------------------ 巡逻设置 ------------------------------
[tasks.others.patrol_loot.patrol]
rounds = 0   # 路线循环轮数，0 = 无限循环

# ------------------------------ 路线点自定义 ------------------------------
# 如需调整路线点坐标、等待时间等参数，在本文件中覆盖即可
# （TOML 数组为整体替换，需写完整 points 列表）：
# [[tasks.others.patrol_loot.route_presets]]
# name = "strange_land"
# [[tasks.others.patrol_loot.route_presets.points]]
# desc = "裂隙上方第一个鱼人"
# mini_coords = [121, 928]
# coords = [1459, 396]
# time = 5
# walk_mode = 1  # 0=右键移动, 1=A键攻击移动, 2=M键移动
# ...（需列出所有路线点）


# ------------------------------ 宠物 ------------------------------
[pet]
feeding_interval = 11  # 喂食间隔（分钟），根据1个食物加的饱和度推荐：30%→10min(8h), 35%→11min(9h), 50%→15min(13h)，括号内为50个食物的可用时长


# ------------------------------ 宝箱检测 ------------------------------
[chest]
ai_conf = 0.85   # 置信度阈值，越高越容易漏检，越低越容易误检
ai_iou = 0.8     # NMS IoU 阈值


# ------------------------------ 物品名称 OCR ------------------------------
[item_text]
char_fixes = { "廣" = "魔", "磨" = "魔" }


# ------------------------------ 拾取配置 ------------------------------
[pickup]
result_timeout = 2   # 拾取后等待错误提示超时（秒）
max_retries = 3       # 不可点击最大重试次数
