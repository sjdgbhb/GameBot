name = "tasks.others.patrol_loot"
extends = ["jiubing2"]

[this]
name = "刷装备"
desired_items = [
    { name = "玄武盔", count = 3 },
    { name = "龙王盔", count = 3 },
    { name = "白眼魔盔", count = 3 },
    { name = "抗魔指环", count = 4 },
    { name = "封魔指环", count = 4 },
    { name = "神殿守卫者战靴", count = 1 },
    { name = "神殿监察者皮靴", count = 1 },
]
route_scheme = "strange_land"
mouse_avoid_pos = [200, 200]
feed_only_interval = 10
clear_nearby_interval = 0

[this.patrol]
rounds = 0

# 物品栏装备配置
# slot: 0~5 对应物品栏第1~6格
# item_id: 物品 id，快捷键从 kk.toml 的 inventory_slots 查找
[hero]
inventory = [
  {slot = 3, item_id = 6},
  {slot = 4, item_id = 9},
  {slot = 5, item_id = 0},
]

