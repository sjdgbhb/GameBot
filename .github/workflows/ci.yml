name: CI

on:
  push:
  pull_request:

jobs:
  branch-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: 检查 PR 来源分支（main 只接受 dev 合并）
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "❌ main 分支只接受来自 dev 的 PR，当前来源分支: ${{ github.head_ref }}"
            exit 1
          fi
          echo "✅ 来源分支为 dev，允许合并"

  test:
    needs: branch-check
    if: always() && (needs.branch-check.result == 'success' || needs.branch-check.result == 'skipped')
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3

      - name: 安装 Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: 同步主依赖
        run: uv sync

      - name: 代码风格检查
        run: uv run ruff check src/ tests/ scripts/ exe/ main.py

      - name: 代码格式检查
        run: uv run ruff format --check src/ tests/ scripts/ exe/ main.py

      - name: 运行单元测试（含覆盖率）
        run: uv run pytest tests/unit/ --cov=GameBot --cov-report=term-missing --cov-fail-under=45 -v

      - name: 运行集成测试
        run: uv run pytest tests/integration/ -v
