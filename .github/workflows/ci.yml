name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3

      - name: 安装 Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: 同步主依赖
        run: uv sync

      - name: 运行单元测试
        run: uv run python -m unittest tests.test_config tests.test_business -v
