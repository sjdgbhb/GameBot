name = "war3.jiubing2"
extends = ["war3"]
# =============================================================================
# 游戏机制配置 (指令、系统、物品定义，多个英雄共享)
# =============================================================================

# ------------------------------ 物品定义表（全局唯一ID） ------------------------------
items = [
  {id = 0, name = "拾取"},        # 拾取物品，在物品栏最后一格
  {id = 1, name = "血瓶"},
  {id = 2, name = "蓝瓶"},
  {id = 3, name = "无敌"},
  {id = 4, name = "米奈希尔传送卷轴"},
  {id = 5, name = "远古森林外围入口传送卷轴"},
  {id = 6, name = "跳刀"},
  {id = 7, name = "鱼竿"},
  {id = 8, name = "水晶"},
  {id = 9, name = "宠物食物"},
]

# ------------------------------ 基础设置 ------------------------------
[game]
map_name = "九种兵器2诸神战场"           # 搜索的地图名
load_war3_time = 33                 # 载入 war3 所需时间（秒）
enter_game_time = 3                # 按 Enter 后进入游戏的时间（秒）
init_game_time = 15  # 游戏初始化时间（秒）
teleport_time = 5  # 传送时间
load_save_time = 8  # 读取存档的时间
combat_timeout = 120  # 等待脱离战斗的最大秒数，超时强制继续
default_difficulty = "普通"  # 默认难度名称（任务配置中可用 difficulty 覆盖），其他选项：困难、噩梦、地狱、诸神的黄昏、折磨一、折磨二、折磨三、折磨四、折磨五

# 难度选择界面配置（OCR 识别难度选项并点击）
[difficulty]
area_coords = [669,106,1233,787]  # 难度选项 OCR 检测区域（客户区坐标）

# ------------------------------ 游戏内指令 ------------------------------
[command]
clear_nearby = "-delh"    # 清理英雄附近地面物品
clear_endless = "-del"    # 清理无尽地图物品
task_query = "-rw"        # 查询任务进度弹窗

# ------------------------------ 圣痕系统 ------------------------------
[stigmata]
load_stigmata = "-shload"   # 读取圣痕指令
switch_hotkey = "F2"        # 打开圣痕界面快捷键
open_coords = [585,769]     # 打开圣痕界面的点击坐标（备用）
coords = [                  # 三套圣痕的开关坐标
    [50, 230],
    [50, 280],
    [50, 330]
]
num_coords = [254,155,740,365]  # 圣痕词条区域坐标（用于显示各词条数值）

# 各词条数值上限
[stigmata.term_limit]
"生命值" = 350
"魔法值" = 350
"暴击伤害" = 50
"物理防御" = 40
"魔法抗性" = 40
"力量" = 40
"自然属性" = 2
"格挡属性" = 5
"穿透属性" = 2
"暴击几率" = 5

# ------------------------------ 卡牌系统 ------------------------------
[card]
switch_hotkey = "F4"
open_coords = [1061,772]        # 点击坐标（备用）
first_coords = [272,336]       # 第一张卡牌中心坐标
gap_x = 75  # 卡牌中心x方向间距
gap_y = 60  # 卡牌中心y方向间距
rows = 5  # 行数
cols = 7  # 列数
confirm_coords = [729,179]     # 确认装备按钮坐标
reset_coords = [729,204]       # 重置装备按钮坐标
card_show_img = 'card_show.bmp'  # 用于判断卡牌窗口是否显示
card_show_area_coords = [710,140,800,210]  # 判断卡牌窗口是否显示的检测区域
card_show_sim = 0.5  # 判断卡牌窗口是否显示的相似度

# ------------------------------ 神碎系统 ------------------------------
[shard]
switch_hotkey = "F3"
shards_per_page = 4  # 每页4条神碎
open_coords = [822,767]            # 备用点击坐标
first_coords = [1093,177]           # 每页第一条神碎激活开关坐标
gap = 50                        # 每条神碎激活开关的 Y 向间距
resonance_coords = [1146,392]       # 激活共鸣按钮坐标
next_page_coords = [1189,632]  # 下一页神碎按钮坐标
switch_absorb_coords = [1247,632]   # 开启/切换吸收神碎的按钮坐标
close_absorb_coords = [1305,632]  # 关闭吸收神碎
resonance_hero_coords = [1417,632]  # 共鸣效果添加给英雄的按钮坐标

# ------------------------------ 右上角属性面板 ------------------------------
[attribute_panel]
switch_coords = [1863,134]          # 折叠收起按钮坐标
switch_size = [8, 2]  # 开关按钮的大小
fold_icon = 'attribute_panel_fold_icon.bmp'  # 收起属性面板的开关图标
unfold_icon = 'attribute_panel_unfold_icon.bmp'  # 展开属性面板的开关图标
switch_area_coords = [1830,120,1880,150]  # 开关识别区域
switch_sim = 0.7
switch_delta_color = '202020'

# ------------------------------ 宠物系统 ------------------------------
[pet]
# 宠物饱腹感每分钟衰减
starvation_rate = 0.03
# 喂食宠物的间隔
feeding_interval = 9.5  # 分钟，大概每分钟掉3%饱和度？，符文礼包加30%饱和度，腐肉35%

# ------------------------------ 原子任务通用配置（可继承） ------------------------------
[atomic_task]
accept_text = "已领取"
complete_text = "前往任务发布者处完成任务"
monitor_interval = 0.2          # 持续文字监测线程的 OCR 间隔（秒），越小越实时

# ------------------------------ 任务进度弹窗（-rw 触发） ------------------------------
# 弹窗在屏幕中心偏上位置弹出，最多显示 3 个任务进度
# 每个任务独占一行，顶部有"任务"标题，右上角有 X 关闭按钮
[task_popup]
area_coords = [677,262,1226,580]    # 弹窗 OCR 区域（客户区坐标，需实测）
window_keyword = "任务"                 # 确认弹窗已打开的关键字
complete_keyword = "已完成"             # 任务完成标注
close_keyword = "关闭"                  # 兜底：关闭按钮文字
close_by_x = true                       # 优先点击右上角 X 按钮关闭
close_offset = [15, 15]                 # X 按钮相对窗口右上角的偏移 [x,y]
open_wait_time = 0.5                    # 发送 -rw 后等待弹窗弹出的时间（秒）

# ------------------------------ 技能面板 ------------------------------
[skill_panel]
first_coords = [1517,842]   # 技能板第一个格子的坐标
gap_x = 106              # 每个格子 X 方向间距
gap_y = 75              # 每个格子 Y 方向间距
rows = 3                # 技能面板行数
cols = 4                # 技能面板列数
learn_skill_grid = [2, 4]  # 打开待学习技能的格子位置（行列索引）



# ------------------------------ 战斗状态检测（AI分类模型） ------------------------------
[combat_status]
in_combat_area_coords = [11,48,98,109]  # 英雄头像区域
frame_count = 6             # 采样帧数
frame_interval = 0.3        # 采样间隔（秒），6帧x0.3s=1.8s覆盖一个闪烁周期
check_interval = 1.0        # 轮询间隔（秒），检测间隔
# AI分类模型参数（combat_status.onnx）
ai_img_w = 87              # 模型输入宽度
ai_img_h = 61              # 模型输入高度
ai_threshold = 0.5         # 分类阈值，>此值判定为战斗中

# ------------------------------ 屏幕提示文本 OCR 区域 ------------------------------
# 屏幕提示文本从下往上滚
[prompt_text]
#area_coords = [110, 551, 500, 644]  # 左半屏幕中段
area_coords = [110, 351, 500, 644]  # 左半屏幕中段
last_area_coords = [117,588,877,622]  # 最新文本出现的区域

# ------------------------------ 宝箱检测（全屏 YOLOv8 目标检测） ------------------------------
[chest]
# AI检测参数
ai_conf = 0.85           # 置信度阈值，高于此值被视为检测目标，越高越容易漏检，越低越容易误检
ai_iou = 0.8             # NMS IoU 阈值，重叠大于此值将被视为一个目标
ai_input_size = 1280     # 模型输入尺寸（需与训练时imgsz一致）
hover_wait_time = 1.5    # 悬停等待物品名称显示的时间（秒）

# ------------------------------ 物品名称 OCR（动态区域，跟随宝箱位置） ------------------------------
[item_text]
offset_y = 50             # 文字在宝箱上方偏移量（像素）
area_width = 200          # OCR 区域宽度
area_height = 60          # OCR 区域高度

# OCR 形近字纠错映射（误识别 → 正确），匹配物品名前先纠正
char_fixes = { "廣" = "魔", "磨" = "魔" }

# ------------------------------ 拾取配置 ------------------------------
[pickup]
unclickable_text = "不可点击"
storage_full_text = "储物箱已满"
result_timeout = 2        # 拾取后等待错误提示超时（秒），超时无提示视为拾取成功
retry_interval = 3        # 不可点击时重试间隔（秒）
max_retries = 3           # 不可点击最大重试次数


