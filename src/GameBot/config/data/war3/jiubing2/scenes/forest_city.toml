# =============================================================================
# 森之城场景配置 — NPC 坐标等
# 供森之城相关任务（声望、迅猛野兽等）共享使用
# 依赖 jiubing2 以获取 skill_panel 坐标计算公式
# =============================================================================
dependencies = ["war3.jiubing2"]

# -------------------------------- 月之女祭司狄安娜 --------------------------------
# 发布"迅猛野兽"等日常任务的 NPC
[war3.jiubing2.scenes.forest_city.npcs.diana]
desc = "月之女祭司狄安娜"
mini_coords = [230,986]     # TODO: 小地图坐标
coords = [936,432]          # TODO: npc坐标
walk_offset = [0, 100]  # 首轮行走目标偏移（y 加 100，避免直接走到 NPC 身上）
walk_mode = 2
time = 5                 # 走到可以接取任务的距离所需的时间（从米奈希尔传送圈进来）
# 技能
beast_grid = [1, 1]      # TODO: 技能面板中「迅猛野兽」任务的格子 [行, 列]（1-based）
