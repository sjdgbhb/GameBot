# =============================================================================
# 卡米村场景配置 — NPC 坐标等
# 供卡米村相关任务（毒蛇、蛇蛋、小炎蛇等）共享使用
# 依赖 jiubing2 以获取 skill_panel 坐标计算公式
# =============================================================================
name = "war3.jiubing2.scenes.kami_village"
extends = ["war3.jiubing2"]

# -------------------------------- 村民杰菲特 ----------------------------------
# 发布"毒蛇"、"蛇蛋"、"小炎蛇（LV4）"等日常任务的 NPC
[this.npcs.jephite]
desc = "村民杰菲特"
mini_coords = [332,845]        # 小地图坐标
coords = [1146,245]             # npc 坐标
walk_offset = [-100, 0]          # 走到 NPC 附近的偏移（x正=右侧，x负=左侧，y正=下方，y负=上方）
walk_mode = 0
time = 1                  # 走到可以接取任务的距离所需的时间（英雄通常已在NPC旁）
# 技能面板格子（1-based [行, 列]）
venomous_snake_grid = [1, 1]       # 「毒蛇」任务格子
snake_egg_grid = [1, 2]            # 「蛇蛋」任务格子
little_flame_snake_grid = [1, 3]   # 「小炎蛇（LV4）」任务格子
