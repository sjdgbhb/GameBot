# =============================================================================
# 多局无尽，刷积分任务配置
# 不能多开，多开需使用携带玩家名的变体配置文件（如 endless_善木木.toml）
# 启动要求：创建好自己的密码房即可开始运行
# =============================================================================
# extends 负责把依赖的 TOML 加载到 cfg 树中，代码负责从各命名空间分别取值
extends = [
    "war3.jiubing2.tasks.endless.endless_single",
    "kk",
    "war3.jiubing2.scenes.menethil",
    "war3.jiubing2.scenes.palace"
]

[this]
name = "多局无尽"
games = 8
wait_time = 180  # 重置 cd 等待时间（秒）

# 前台或后台模式
[war3]
bind_mode = "background"  # 后台模式，默认使用前台，即foreground
[kk]
bind_mode = "background"  # 后台模式，默认使用前台，即foreground

# 圣痕
[hero.stigmata]
is_open = true  # 是否使用圣痕
use_index = 1  # 使用第几套圣痕

# 卡牌
[hero.card]
is_open = true  # 是否装备卡牌
use_index = [
    [1, 1],
    [1, 2],
    [2, 2],
    [5, 2],
    [5, 5],
    [4, 5],
]  # 示例：[1, 1] 即第1行第1列的卡牌

# 神碎配置
[hero.shard]
is_open = true  # 是否装备神碎
is_resonance = true  # 是否激活神碎共鸣
is_absorb = true  # 是否吸收覆盖神碎
max_pages = 3  # 神碎最大可用页数
use_index = [
   [1, 2],
   [1, 3],
   [1, 4],
   [3, 1]
]  # 示例：[1, 2] 即第1页第2行
absorb_index = [1, 1]  # 在第几页第几行吸收神碎，会自动覆盖当前位置神碎，务必慎重！！！