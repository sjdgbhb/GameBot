# =============================================================================
# 多局无尽变体 — 岁月神偷（多开认领，小号）
# 继承 endless 全部配置，[this] 只写差异字段；文件名即启动参数。
# 启动：.venv\Scripts\python -m GameBot.runner.tasks.war3.jiubing2.endless.endless endless_岁月神偷
# 启动要求：账号停留在 KK 房间内（创建好密码房即可运行）；认领失败任务停止
# =============================================================================
extends = ["war3.jiubing2.tasks.endless.endless"]

# 浮窗位置错开：另一脚本用默认 y，本变体偏移避免遮挡
[base.float_window]
y = 500

[this]
# 多开认领目标玩家名：KK 房间聊天 token / war3 加载页玩家列表判归属。
# target_player 非空自动推导 bind_mode=background；显示名/日志名由任务动态拼接。
target_player = "岁月神偷"

# 神碎配置 —— 小号
# [hero] 为浅合并，shard 子键整表覆盖继承值，须写全字段
[hero.shard]
is_open = true       # 是否装备神碎
is_resonance = true  # 是否激活神碎共鸣
is_absorb = true     # 是否吸收覆盖神碎
max_pages = 3        # 神碎最大可用页数
use_index = [
    [1, 1],
    [1, 2],
    [1, 3],
    [2, 4]
]  # 示例：[1, 2] 即第1页第2行
absorb_index = [2, 3]  # 在第几页第几行吸收神碎，会自动覆盖当前位置神碎，务必慎重！！！
