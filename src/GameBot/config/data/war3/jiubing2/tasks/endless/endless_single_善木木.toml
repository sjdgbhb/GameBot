# =============================================================================
# 局内无尽积分任务配置
# endless_single.py  英雄在3点石笋位置即可运行
# 启动：uv run python -m GameBot.runner.tasks.war3.jiubing2.endless.endless_single endless_single_善木木
# =============================================================================
extends = ["war3.jiubing2.tasks.endless.endless_single"]


[this]
target_player = "善木木"  # 根据平台用户名修改

[war3]
bind_mode = "background"

# 浮窗位置错开：另一脚本用默认 y，本变体偏移避免遮挡
[base.float_window]
y = 500