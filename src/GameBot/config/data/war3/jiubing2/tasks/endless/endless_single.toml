# =============================================================================
# 局内无尽积分任务配置
# endless.py  创建好密码房即可运行
# endless_single.py  英雄在3点石笋位置即可运行
# =============================================================================
name = "war3.jiubing2.tasks.endless.endless_single"
extends = ["war3.jiubing2.heroes.hxd", "kk"]   # heroes.hxd 传递依赖 jiubing2；kk 提供物品栏快捷键

[this]
name = "局内无尽"
min_level = 15  # 从该层数开始
max_level = 45  # 到该层结束
loop_interval_time = 5
refresh_timer = 20  # 当层无尽打完后至下一层开始的刷新时间
use_shard_floor = 20  # 从该层开始使用魔法水晶
drink_floor = 20  # 从该层开始喝药（英雄减伤低，容易掉血）
pet_feed_interval = 100  # 每100秒喂一次
boss_death_text = "开始挑战"  # BOSS 死亡后屏幕提示文字（OCR 检测）
boss_death_timeout = 60  # 等待 BOSS 死亡提示的超时时间（秒），超时用当前时间兜底

# 神碎配置 !!!!!!
[hero.shard]
is_open = true  # 是否装备神碎
is_resonance = true  # 是否激活神碎共鸣
is_absorb = true  # 是否吸收覆盖神碎
max_pages = 3  # 神碎最大可用页数
# 小号
# use_index = [
#     [1, 1],
#     [1, 2],
#     [1, 3],
#     [2, 4]
# ]  # 示例：[1, 2] 即第1页第2行
# absorb_index = [2, 3]  # 在第几页第几行吸收神碎，会自动覆盖当前位置神碎，务必慎重！！！
# 大号
use_index = [
   [1, 2],
   [1, 3],
   [1, 4],
   [3, 1]
]  # 示例：[1, 2] 即第1页第2行
absorb_index = [1, 1]  # 在第几页第几行吸收神碎，会自动覆盖当前位置神碎，务必慎重！！！

