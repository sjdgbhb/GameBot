# =============================================================================
# 城门骚扰原子任务配置
# 任务流程：走到 NPC → 点技能格接 → 沿路线 A 清怪 → OCR 检测完成 → 回 NPC 交
# NPC 坐标、技能格等场景信息见 scenes/blackstone_city.toml
# =============================================================================
dependencies = ["war3.jiubing2.scenes.blackstone_city"]

[war3.jiubing2.tasks.atomic.blackstone_gate_harassment]
name = "城门骚扰"
accept_timeout = 8                 # 接取后等提示的超时（秒）
route_complete_timeout = 120       # 路线走完仍未完成的兜底超时（秒）
combat_mode = "auto_attack"        # 战斗模式：auto_attack（全程平A）/ cast_skills（自动施法）

# =============================================================================
# 路线点（按顺序执行，walk_mode=1 = A+左键边走边打，末点是 NPC 附近即交任务）， 约74秒
