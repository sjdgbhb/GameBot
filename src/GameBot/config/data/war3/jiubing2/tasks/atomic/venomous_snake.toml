# =============================================================================
# 毒蛇原子任务配置
# 任务流程：走到村民杰菲特 → 点技能格接 → 沿路线清怪 → OCR 检测完成 → 回 NPC 交
# NPC 坐标、技能格等场景信息见 scenes/kami_village.toml
# =============================================================================
extends = ["war3.jiubing2.scenes.kami_village", "war3.jiubing2.heroes.hxd", "kk"]

[this]
name = "毒蛇"
respawn_time = 60                  # 杀怪后刷新间隔（秒），毒蛇1分钟刷新
cooldown_start = "kill"             # 冷却计时起点：kill=开始杀毒蛇时（毒蛇1路线点），submit=提交任务时
accept_timeout = 8                 # 接取后等提示的超时（秒）
route_complete_timeout = 120       # 路线走完仍未完成的兜底超时（秒）

# =============================================================================
# 路线点（按顺序执行，walk_mode=1 = A+左键边走边打，末点是 NPC 附近即交任务）
# =============================================================================
[[this.points]]
desc = "农场上部"
mini_coords = [332,845]
coords = [1302,244]
walk_mode = 0
time = 3

