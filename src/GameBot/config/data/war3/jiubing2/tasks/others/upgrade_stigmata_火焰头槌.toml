# =============================================================================
# 升级圣痕变体 — 火焰头槌（多开认领，局内任务：启动时已在游戏内）
# 继承 upgrade_stigmata 全部配置，[this] 只写差异字段；文件名即启动参数。
# 启动：uv run python -m GameBot.runner.tasks.war3.jiubing2.others.upgrade_stigmata upgrade_stigmata_火焰头槌
# =============================================================================
extends = ["war3.jiubing2.tasks.others.upgrade_stigmata"]

# 浮窗位置错开：默认 y=400，本变体下移避免与其他实例遮挡
[base.float_window]
y = 620

[this]
# 多开认领目标玩家名：war3 聊天 token 回显"玩家名：token"判归属
target_player = "火焰头槌"

# 多开认领必须后台绑定：直接覆盖命名空间级默认值
[war3]
bind_mode = "background"
[kk]
bind_mode = "background"
