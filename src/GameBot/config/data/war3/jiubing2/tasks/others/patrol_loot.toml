name = "war3.jiubing2.tasks.others.patrol_loot"
extends = [
  # "war3.jiubing2.heroes.paladin", 
  "kk"
]

[this]
name = "刷装备"
desired_items = [
    { name = "玄武盔", count = 5 },
    { name = "龙王盔", count = 5 },
    { name = "白眼魔盔", count = 5 },
    { name = "抗魔指环", count = 5 },
    { name = "封魔指环", count = 5 },
    { name = "神殿守卫者战靴", count = 1 },
    { name = "神殿监察者皮靴", count = 1 },
]
route_scheme = "strange_land_right"  # strange_land_right=奇异之地（右）、strange_land_left=奇异之地（左）、shattered_desert=破碎荒漠
mouse_avoid_pos = [200, 200]
feed_only_interval = 10
clear_nearby_interval = 0

[this.patrol]
rounds = 0

# 物品栏装备配置
# slot: 格子编号 0~5 对应第 1~6 格
# item: 物品名（映射表在 jiubing2.toml 的 items 中），也可用 item_id = 数字
# 快捷键从 kk.toml 的 inventory_slots 查找
[hero]
inventory = [
  {slot = 3, item = "跳刀"},
  {slot = 4, item = "宠物食物"},
  {slot = 5, item = "拾取"},
]

