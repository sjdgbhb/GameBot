# =============================================================================
# 刷局数任务配置（多局挂机）
# 流程：KK 房间开始游戏 → 选完难度后挂机 idle_time 秒 → 退出本局 → 循环
# 不能多开，多开需使用携带玩家名的变体配置文件（如 game_count_善木木.toml）
# 启动要求：创建好自己的密码房即可开始运行
# =============================================================================
extends = ["war3.jiubing2", "kk"]

[this]
name = "刷局数"
games = 100               # 总局数
idle_time = 630          # 选完难度后挂机时长（秒），挂满才算有效局
loop_interval_time = 5   # 局间等待（秒）
# difficulty = "普通"    # 目标难度，缺省用 game.default_difficulty

# 前台或后台模式
[war3]
bind_mode = "background"  # 后台模式，默认使用前台，即foreground
[kk]
bind_mode = "background"  # 后台模式，默认使用前台，即foreground
