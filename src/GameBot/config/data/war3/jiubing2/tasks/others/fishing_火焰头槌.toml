# =============================================================================
# 钓鱼任务变体 — 火焰头槌（多开认领）
# 继承 fishing.toml 全部配置，[this] 只写差异字段；文件名即启动参数。
# 启动：uv run python -m GameBot.runner.tasks.war3.jiubing2.others.fishing fishing_火焰头槌
# =============================================================================
extends = ["war3.jiubing2.tasks.others.fishing"]

# 浮窗位置错开：默认 y=380、岁月神偷 y=500，本变体继续下移避免遮挡
[base.float_window]
y = 620

[this]
# 多开认领目标玩家名：向候选窗口发随机 token，OCR 聊天区匹配
# "玩家名：token" 行提取归属名，仅匹配此值才认领；删除该行则认领任意空闲窗口。
target_player = "火焰头槌"
max_times = 50  # 抛竿次数
