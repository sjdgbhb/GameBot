# 启动：uv run python -m GameBot.runner.tasks.war3.jiubing2.others.patrol_loot patrol_loot_善木木

extends = [
  "war3.jiubing2.tasks.others.patrol_loot",
]

[this]
# 多开认领目标玩家名：war3 聊天 token 回显"玩家名：token"判归属
target_player = "善木木"
desired_items = [
    { name = "玄武盔", count = 4 },
    { name = "龙王盔", count = 5 },
    { name = "白眼魔盔", count = 1 },
    { name = "抗魔指环", count = 4 },
    { name = "封魔指环", count = 4 },
    { name = "神殿守卫者战靴", count = 0 },
    { name = "神殿监察者皮靴", count = 1 },
]

# 多开认领必须后台绑定：直接覆盖命名空间级默认值
[war3]
bind_mode = "background"