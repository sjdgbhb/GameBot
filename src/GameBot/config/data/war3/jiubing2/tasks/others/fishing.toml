# =============================================================================
# 钓鱼自动化任务配置
# 钓鱼逻辑：
# 1、抛竿后，英雄附近出现一排未填充的圈圈和三角形（其中三角形只有2个且相邻，可以出现在任意位置）
# 2、从左至右依次填充（圆圈填充为蓝色，三角形填充为红色），当填充到三角形时，需立刻收竿，钓鱼就会成功
# =============================================================================
name = "war3.jiubing2.tasks.others.fishing"
extends = ["war3.jiubing2", "kk"]   # war3.jiubing2 传递依赖 war3，提供游戏指令和 OCR 区域配置；kk 提供物品栏快捷键

# ------------------------------ 物品栏配置（背包1-6格） ------------------------------
# 钓鱼不依赖特定英雄，但需要物品栏配置（鱼竿）
# slot: 格子编号 0~5 对应第 1~6 格
# item: 物品名（映射表在 jiubing2.toml 的 items 中），也可用 item_id = 数字
# 快捷键从 kk.toml 的 inventory_slots 查找
[hero]
inventory = [
  {slot = 3, item = "鱼竿"},  # 鱼竿
]

[this]
name = "钓鱼"
max_times = 10000  # 抛竿次数
fishing_interval_time = 1  # 钓鱼间隔
clear_nearby_probability = 1  # 每次收竿后清理英雄附近物品的概率（0~1），0 = 禁用
mode = 0  # 以何种方法检测中钩，0找色（红色三角形填充），1找图
hook_coords = [943, 554]  # 鱼钩位置
is_test_check = false  # 是否测试中钩区域
# 大漠窗口绑定模式：foreground（前台，用 bind_foreground 参数）/ background（后台，用 bind_background 参数）
#   - 顶层任务可在自身 [this] 中设置 bind_mode 覆盖此默认值
#   - 多成员组队（成员数 > 1）：强制 background，忽略此配置
bind_mode = "background"

[this.check]
# 预判收竿：填充循环周期稳定（实测 ~3.1s），用红色出现时刻+周期推算下次出现时刻，
# 提前 retract_lead_time 秒按键，补偿按键到游戏执行的固有延迟（约 100~200ms）。
# 周期跨竿缓存：首竿等 2 次红色出现实测周期，后续竿只等 1 次即可出手（每竿省约 3 秒）
retract_lead_time = 0.1  # 提前量（秒）。收竿仍偏晚则调大，收竿过早（红色未出现就收）则调小
hook_sim = 1  # 中钩颜色/找图相似度（越低越早检测到，但可能误触）
# 找图
hook_status_image = "hook_status.bmp"  # 中钩图片
status_area_coords = [850, 350, 1200, 450]  # 检测是否中钩的区域
hook_delta_color = '202020'  # 中钩颜色色差（越大越宽松）
# 找色
hook_color = 'ff0000'  # 中钩三角形填充的颜色
hook_attempts = 200  # 一次钓鱼的检测次数
hook_check_interval = 0.005  # 轮询间隔（秒），忙循环时不使用
hook_timeout = 15  # 一次钓鱼等待中钩的超时时间（秒）
