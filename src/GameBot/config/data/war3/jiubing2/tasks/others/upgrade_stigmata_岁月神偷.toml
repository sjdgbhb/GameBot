# =============================================================================
# 升级圣痕变体 — 岁月神偷（多开认领，局内任务：启动时已在游戏内）
# 继承 upgrade_stigmata 全部配置，[this] 只写差异字段；文件名即启动参数。
# 启动：uv run python -m GameBot.runner.tasks.war3.jiubing2.others.upgrade_stigmata upgrade_stigmata_岁月神偷
# =============================================================================
extends = [
    "war3.jiubing2.tasks.others.upgrade_stigmata",
    "war3.jiubing2.heroes.shaman"
]


[this]
# 多开认领目标玩家名：war3 聊天 token 回显"玩家名：token"判归属
target_player = "岁月神偷"

# 多开认领必须后台绑定：直接覆盖命名空间级默认值
[war3]
bind_mode = "background"

