############## 魔剑士 ##############
extends = ["war3.jiubing2"]


[hero]
name = "魔剑士"
floor_key = "P"
mini_coords = [186,900]
coords = [868,400]
load_save = "-load1"
# ------------------------------ 物品栏配置（背包1-6格） ------------------------------
# slot: 格子编号 0~5 对应第 1~6 格
# item: 物品名（映射表在 jiubing2.toml 的 items 中），也可用 item_id = 数字
# 快捷键从 kk.toml 的 inventory_slots 默认配置中查找，无需在此重复配置
inventory = [
  {slot = 0, item = "血瓶"},
  {slot = 1, item = "无敌"},
  {slot = 2, item = "米奈希尔传送卷轴"},
  {slot = 3, item = "跳刀"},
  {slot = 4, item = "宠物食物"},
  {slot = 5, item = "拾取"},
]