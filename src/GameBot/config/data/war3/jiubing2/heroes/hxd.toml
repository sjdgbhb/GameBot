# =============================================================================
# 英雄配置：异界之人
# =============================================================================
name = "war3.jiubing2.heroes.hxd"
extends = ["war3.jiubing2"]

[hero]
name = "异界之人"
floor_key = "O"
mini_coords = [186,900]
coords = [1232,446]
load_save = "-load3"
# ------------------------------ 物品栏配置（背包1-6格） ------------------------------
# slot: 格子编号 0~5 对应第 1~6 格
# item: 物品名（映射表在 jiubing2.toml 的 items 中），也可用 item_id = 数字
# 快捷键从 kk.toml 的 inventory_slots 默认配置中查找，无需在此重复配置
inventory = [
  {slot = 0, item = "血瓶"},
  {slot = 1, item = "水晶"},
  {slot = 2, item = "米奈希尔传送卷轴"},
  {slot = 3, item = "跳刀"},
  {slot = 4, item = "宠物食物"},
  {slot = 5, item = "拾取"},
]

# ------------------------------ 技能 ------------------------------
# id: 技能唯一标识，路线点通过 id 引用技能
# key: 游戏内快捷键
# target_type: self(自身/无指向) | ground(地面目标) | enemy(锁头敌方) | ally(锁头友军)
# position: target_area(目标区域) 、target（目标），具体坐标需自行抓取后在路线点设置
skills = [
  {id = 0, desc = '轨道炮', key = "Q", target_type = "ground", position = 'target_area'},
  {id = 1, desc = '舰队信标', key = "T", target_type = "ground", position = "target_area"},
  {id = 2, desc = '相位作战服', key = "R", target_type = "self"},
]

# ------------------------------ 学习技能列表（按学习顺序） ------------------------------
learn_skills = [
  {index_x = 1, index_y = 1},
  {index_x = 1, index_y = 3},
  {index_x = 1, index_y = 1},
  {index_x = 1, index_y = 1},
]

# ------------------------------ 圣痕 ------------------------------
[hero.stigmata]
is_open = true
use_index = 1

# ------------------------------ 卡牌 ------------------------------
[hero.card]
is_open = true
use_index = [
    [1, 1],
    [1, 2],
    [2, 2],
    [5, 2],
    [5, 5],
    [4, 5],
]

# ------------------------------ 神碎 ------------------------------
# 神碎配置
[hero.shard]
is_open = true  # 是否装备神碎
is_resonance = true  # 是否激活神碎共鸣
is_absorb = true  # 是否吸收覆盖神碎
max_pages = 3  # 神碎最大可用页数
use_index = [
    [1, 2],
    [1, 3],
    [2, 2],
    [2, 3]
]  # 示例：[1, 2] 即第1页第2行
absorb_index = [1, 1]  # 在第几页第几行吸收神碎，会自动覆盖当前位置神碎