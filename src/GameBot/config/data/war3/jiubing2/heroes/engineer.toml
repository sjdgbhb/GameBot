############## 构造师 ##############
dependencies = ["war3.jiubing2"]


[hero]
name = "构造师"
floor_key = "P"

# ------------------------------ 物品栏配置（背包1-6格） ------------------------------
[[hero.inventory]]
slot = 0
id = 1
hotkey = "1"

[[hero.inventory]]
slot = 1
id = 2
hotkey = "2"

[[hero.inventory]]
slot = 5
id = 0
hotkey = "6"

# ------------------------------ 学习技能 ------------------------------
# 默认学习的技能

# ------------------------------ 技能池 ------------------------------
# id: 技能唯一标识，路线点通过 id 引用技能
# key: 游戏内快捷键
# target_type: self(自身/无指向) | ground(地面目标) | enemy(锁头敌方) | ally(锁头友军)
# position: target_area(目标区域) 、target（目标），具体坐标需自行抓取后在路线点设置
# fixed_key = true 可以编辑该技能的快捷键
# 共18个技能，初级技能4个，二级技能6个（无序，元素相同，2种效果），三级技能4个（无序，元素相同，3种效果），终级技能4个（初始元素固定，其他无序，3种效果）
[[hero.skills]]
id = 0
desc = '法术重构'
key = "Q"
target_type = "self"

