############## 狂战士 ##############
name = "war3.jiubing2.heroes.berserker"
extends = ["war3.jiubing2"]


[hero]
name = "狂战士"
floor_key = "P"
mini_coords = [186,900]
coords = [1109,256]
load_save = "-load1"
# ------------------------------ 物品栏配置（背包1-6格） ------------------------------
# slot: 格子编号 0~5 对应第 1~6 格
# item: 物品名（映射表在 jiubing2.toml 的 items 中），也可用 item_id = 数字
# 快捷键从 kk.toml 的 inventory_slots 默认配置中查找，无需在此重复配置
inventory = [
  {slot = 0, item = "血瓶"},
  {slot = 1, item = "无敌"},
  {slot = 2, item = "米奈希尔传送卷轴"},
  {slot = 3, item = "跳刀"},
  {slot = 4, item = "宠物食物"},
  {slot = 5, item = "拾取"},
]

# ------------------------------ 技能 ------------------------------
# id: 技能唯一标识，路线点通过 id 引用技能
# key: 游戏内快捷键
# target_type: self(自身/无指向) | ground(地面目标) | enemy(锁头敌方) | ally(锁头友军)
# position: target_area(目标区域) 、target（目标），具体坐标需自行抓取后在路线点设置
skills = [
    {id = 0, desc = "战争号角/兽神之力", key = "Q", target_type = "self"},
    {id = 1, desc = "狂怒击", key = "W", target_type = "enemy", position = "target"},
    {id = 2, desc = "毁灭风暴", key = "R", target_type = "self"},
    {id = 3, desc = "狂暴杀戮", key = "T", target_type = "self"},
]

# ------------------------------ 学习技能列表（按学习顺序） ------------------------------
learn_skills = [
  {index_x = 1, index_y = 1},  # 第一个技能，第一行第一列
  {index_x = 1, index_y = 3},  # 第二个技能，第一行第一列
  {index_x = 1, index_y = 1},  # 第三个技能，第一行第一列
  {index_x = 1, index_y = 2},  # 第四个技能，第一行第一列
]