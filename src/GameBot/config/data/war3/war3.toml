# War3 窗口/界面交互配置 (随游戏版本可能调整)
name = "war3"
extends = ["base"]

[this]
window_class = "Warcraft III"
window_title = "Warcraft III"
client_size = [1902, 1033] # 窗口客户区大小 [宽，高]——所有坐标均以此尺寸标定，运行时强制对齐
# 对应 KK 平台 → 设置 → 图像设置，需与开发环境保持一致：
#   1. war3（非重置版），窗口模式，分辨率和窗口尺寸均设为 1920x1080
#   2. 启用视距调整，视距高度3000
small_window_response_time = 0.5 # 小窗口响应时间（秒）
quit_war3_time = 2 # 退出 war3 的时间
interface_switch_time = 0.5 # war3 界面切换时间（秒）
general_time = 0.3 # 普通延迟（秒）
key_time = 0.1 # 按键、点击间法
cast_move_time = 0.05 # 鼠标移动都某区域施法所需移动时间
fast_skill_time = 0.3 # 需要快速施法的时候，设置此操作间隔
unit_nearby_offset = 100 # 单位附近的偏移量（像素），以单位中心坐标为中心，半径 100 内视为单位附近
unit_offset = 10 # 点击单位的偏移量
cast_skill_offset = 180 # 指向前方施放，单位为中心偏移

end_statistics_img = 'end_war3_statistics.bmp' # 退出 war3 时，会在退出前出现玩家本局资源统计页面，此图片作为检测此页面是否出现的判断依据
end_statistics_area_coords = [1269,896,1740,1022] # 检测区域
end_statistics_sim = 0.7 # 相似度
end_statistics_delta_color = '202020'

mini_map_signal_img = 'mini_map_signal_icon.bmp' # war3 菜单栏，用于检测是否处于游戏内
mini_map_signal_area_coords = [363,784,428,833]
mini_map_signal_sim = 0.7
mini_map_signal_delta_color = '202020'

check_interval_time = 2 # 检测间隔

# 大漠窗口绑定模式：foreground（前台，用 bind_foreground 参数）/ background（后台，用 bind_background 参数）
#   - 顶层任务可在自身 [this] 中设置 bind_mode 覆盖此默认值
#   - 多成员组队（成员数 > 1）：强制 background，忽略此配置
bind_mode = "foreground"

# 等待 war3 窗口出现超时（bind_war3_window / wait_for_game_window）
[this.wait_for_game_window]
timeout = 60

# 进游戏检测配置
[this.in_game_detect]
method = "image"       # "image"=图色检测（使用 mini_map_signal_* 配置）, "none"=纯等待不检测
timeout = 120          # 等待进入游戏的超时时间（秒），超时可能卡在加载界面

# 前台绑定参数（bind_mode = foreground 时生效）
[this.bind_foreground]
display = "normal"     # 可选：normal / gdi / gdi2 / dx / dx2 / dx3
mouse = "normal"       # 可选：normal / windows / windows2 / windows3
keypad = "normal"      # 可选：normal / windows
mode = 0               # 大漠 BindWindow 附加模式

# 后台绑定参数（bind_mode = background 或多成员组队时生效）
# War3 是 DirectX 渲染窗口，用 dx2 后台截图
# dx2 + windows3 + windows 需要管理员权限
# 注意：dx2 模式要求窗口有一部分在屏幕外（Win7/Vista 不需要），且不可连续操作需加 10ms 延时
[this.bind_background]
display = "dx2"        # DirectX 后台截图，窗口进程崩溃风险低于 dx
# dx.mouse.position.lock.api：进程内锁定位 API，隔离系统鼠标对 DirectInput 游戏的影响
# windows2 是组合模式 dx.mouse.position.lock.api|dx.mouse.position.lock.message|dx.mouse.state.message，
# 额外叠加消息级锁位与状态同步——实测在该组合下 war3 鼠标卡顿且系统鼠标仍会干扰游戏光标
mouse = "dx.mouse.position.lock.api"
keypad = "windows"     # Windows 后台键盘
public = "dx.public.active.api"  # 公共窗口激活（dx 系绑定建议保留，缺失时窗口状态迁移易抖动）
mode = 4
bind_delay = 1.5       # 绑定后延时 1.5 秒等待后台生效（DX 绑定较慢）

# 多开识别配置
[this.multi_instance]

[this.multi_instance.loading_page]
area_coords = [231,295,1532,581]  # 加载页面玩家列表 OCR 区域
exclude_keywords = []  # 需过滤的非玩家名文本关键词（如称号前缀等），留空则仅按位置取第一个非空行
