dependencies = []
# =============================================================================
# 基础环境配置（极少变动）
# =============================================================================

# ---------------------------------------------------------------------------
# 路径配置
# ---------------------------------------------------------------------------
[paths]
log_path = "logs"                                # 日志输出目录
resources_path = "src/GameBot/resources"     # 资源根目录

# ---------------------------------------------------------------------------
# 大漠插件配置
# 大漠 COM 要求 32 位 Python 3.8，Web 服务器运行在主环境（3.12），启动任务
# 子进程时需用 .venv-dm 的 Python。默认自动检测 .venv-dm/Scripts/python.exe，
# 如路径非标准可取消注释下方配置项。
# 创建方式：uv venv .venv-dm --python 3.8（需 32 位 Python 3.8）
# ---------------------------------------------------------------------------
[dm]
version = "3.1233"          # 期望的大漠插件版本
dll_path = "external/dm"    # 大漠 DLL 所在目录
# python_path = ".venv-dm/Scripts/python.exe"  # 可选：大漠脚本 Python 路径（默认自动检测）

# ---------------------------------------------------------------------------
# 推理子进程配置（64 位 Python 3.12，主环境 .venv）
# 大漠需 32 位 3.8，OCR/AI 推理需 64 位，不能同进程
# 子进程统一提供 OCR、宝箱检测、战斗检测三种推理能力（见 inference/worker.py）
# ---------------------------------------------------------------------------
[inference]
# 推理设备："cpu" 或 "gpu"。实测本场景（小区域单张图）CPU 已足够快，建议 cpu
device = "gpu"
# 模型目录（相对于项目根目录）
models_dir = "src/GameBot/resources/models"
# python_path = ".venv/Scripts/python.exe"  # 可选：推理子进程 Python 路径（默认自动检测）

# ---------------------------------------------------------------------------
# 浮窗默认配置（可被任务配置中的 [float_window] 覆盖）
# ---------------------------------------------------------------------------
[float_window]
x = 20       # 浮窗默认 x 坐标（屏幕坐标） 浮窗左上角坐标
y = 380      # 浮窗默认 y 坐标（屏幕坐标）
width = 300  # 浮窗宽度（像素）