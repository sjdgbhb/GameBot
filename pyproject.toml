[project]
name = "GameBot"
version = "0.1.0"
description = "魔兽争霸3 RPG地图九种兵器2的Python自动化脚本系统"
readme = "README.md"
authors = [
    { name = "sjdgbhb", email = "sjdgbhb@163.com" }
]
requires-python = ">=3.12"  # 主环境：Web 服务器、OCR/AI 推理（64 位 Python 3.12）
dependencies = [
    # ── Web 服务器 ──
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.6",
    # ── OCR / AI 推理 ──
    "rapidocr",
    "onnxruntime",
    "numpy",
    "Pillow>=10.0.0",
    # ── 通用工具 ──
    "loguru>=0.7.3",
    # ── Windows COM（IDE 静态分析需要；运行时走 bridge 驱动，不直接导入 win32com）──
    "pywin32>=311; sys_platform == 'win32'",
    "windows-capture==2.0.1",
]

[project.scripts]
GameBot-web = "GameBot.web.server:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
]
markers = [
    "unit: 单元测试",
    "integration: 集成测试（真实文件 I/O，多模块协作）",
    "manual: 需人工介入的手动测试",
    "dm: 依赖大漠插件 COM（经 dm_bridge 子进程调用）",
    "slow: 耗时较长的测试",
    "inference: 依赖 ONNX / AI 模型的推理测试",
    "web: Web API / FastAPI 测试",
    "config: 配置系统测试",
]

[tool.ruff]
line-length = 120
target-version = "py38"  # 按 3.8 检查语法，保护 dm_bridge（3.8 子进程）共享代码；主环境 3.12 语法差异需自行注意

[tool.ruff.lint]
select = ["F", "I"]
ignore = ["E501"]
